
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Campus AI Assistant</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f6fc;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .error-container {
            background: white;
            width: 100%;
            max-width: 520px;
            padding: 45px 30px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .error-code {
            font-size: 76px;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 14px;
        }

        p {
            color: #64748b;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .home-button {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .home-button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>
    <main class="error-container">
        <div class="error-code">404</div>

        <h1>Page Not Found</h1>

        <p>
            Sorry, the page you are looking for could not be found.
            It may have been moved or the address may be incorrect.
        </p>

        <a href="/" class="home-button">Return to Home</a>
    </main>
</body>
</html>
