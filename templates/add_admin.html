<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Admin | Campus AI Assistant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            margin: 0;
            padding: 30px 16px;
        }

        .container {
            max-width: 480px;
            margin: 40px auto;
            padding: 28px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-top: 0;
            color: #1e293b;
        }

        label {
            display: block;
            margin-top: 16px;
            font-weight: bold;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        button, .back-link {
            display: inline-block;
            margin-top: 20px;
            padding: 11px 16px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
        }

        button {
            color: white;
            background: #2563eb;
        }

        .back-link {
            color: #1e293b;
            background: #e2e8f0;
        }

        .message {
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            background: #f1f5f9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Add New Administrator</h2>
        <p>Create an administrator account for Campus AI Assistant.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('add_admin') }}">
            <label for="full_name">Full Name</label>
            <input
                type="text"
                id="full_name"
                name="full_name"
                required
                maxlength="100"
            >

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                required
                maxlength="254"
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                required
                minlength="12"
                autocomplete="new-password"
            >

            <button type="submit">Create Admin</button>
        </form>

        <a class="back-link"
           href="{{ url_for('admin_dashboard') }}">
            Back to Dashboard
        </a>
    </div>
</body>
</html>
